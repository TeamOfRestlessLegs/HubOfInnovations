services:
  oauth:
    build: ./oauth
    container_name: oauth
    ports:
      - "8080:8080"
    networks:
      - hubofinnovations-network
    environment:
      - SERVER_PORT=${OAUTH_INTERNAL_PORT:-8080}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8000:8000"
    networks:
      - hubofinnovations-network
    env_file:
      - ./ai-service/.env                       # OPENAI_KEY (plik nie trafia do obrazu ani do gita)
    environment:
      - VECTOR_DB_PATH=/app/vector_db
      - SPLOT_DANE_DIR=/dane
      - INNOVATIONS_API_URL=http://innovations:8081   # szczegóły innowacji do /search (nazwa serwisu w sieci dockera)
    volumes:
      - ./ai-service/vector_db:/app/vector_db   # budowana przez automations/build_vector_db.py
      - ../Dane:/dane                           # Obserwator (pakiet splot_dane + obserwator.sqlite)
      - hf_models:/models                       # cache modelu embeddingów Obserwatora

  innovations:
    build: ./innovations                        # wymaga wcześniej: mvn -pl innovations -am package
    container_name: innovations
    ports:
      - "8081:8081"
    networks:
      - hubofinnovations-network
    environment:
      - SERVER_PORT=8081
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432                      # port wewnątrz sieci dockera, niezależny od mapowania na hosta
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-hubdb}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-hubdb}
    networks:
      - hubofinnovations-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hubdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  hubofinnovations-network:
    driver: bridge

volumes:
  postgres_data:
  hf_models:
